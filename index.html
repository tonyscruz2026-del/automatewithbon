<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NexOps | AI Automation</title>

    <meta
        name="description"
        content="AI Automation Solutions for Modern Businesses."
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="./css/hero3d.css"
    >

    <link
        rel="stylesheet"
        href="./css/parallaxLayers.css"
    >

</head>

<body>

    <!-- ======================================
         HERO
    ======================================= -->

    <div class="hero-scroll-wrapper">

        <header class="hero">

            <!-- Three.js Canvas -->

            <canvas id="heroCanvas"></canvas>

            <!-- Space cloud / nebula parallax layer -->

            <div class="atmosphere-layer" aria-hidden="true">

                <div class="cloud cloud-left-far"></div>
                <div class="cloud cloud-right-far"></div>
                <div class="cloud cloud-left-near"></div>
                <div class="cloud cloud-right-near"></div>

            </div>

            <!-- Icon overlay for each project sphere -->

            <div id="labelLayer" class="label-layer"></div>

            <!-- Dark Overlay -->

            <div class="hero-overlay"></div>

            <!-- Hero Content -->

            <section class="hero-content">

                <span class="eyebrow">

                    AI AUTOMATION

                </span>

                <h1>

                    Automate Your Business

                    <span>

                        Like a Pro

                    </span>

                </h1>

                <p>

                    Intelligent AI systems that automate operations,
                    qualify leads,
                    manage reviews,
                    and grow your business.

                </p>

                <div class="hero-buttons">

                    <a
                        href="#"
                        class="primary"
                    >

                        Book Discovery Call

                    </a>

                    <a
                        href="#"
                        class="secondary"
                    >

                        View Portfolio

                    </a>

                </div>

            </section>

            <!-- Scroll cue: hints there's more below the pinned hero -->

            <div class="scroll-cue">

                <span>Scroll to explore</span>
                <span class="scroll-cue-line"></span>

            </div>

        </header>

    </div>

    <!-- ======================================
         NEXT SECTION — swap for real content.
         This just gives the page room to scroll
         so the parallax has somewhere to go.
    ======================================= -->

    <section class="parallax-section">

        <div class="parallax-stage">

            <div class="parallax-layer parallax-layer--back"></div>
            <div class="parallax-layer parallax-layer--mid"></div>
            <div class="parallax-layer parallax-layer--front"></div>

            <div class="parallax-caption">
                <h2>Built to Scale With You</h2>
                <p>Every workflow, every integration, working together.</p>
            </div>

        </div>

    </section>

    <!-- ======================================
         FUTURE PROJECT INFO PANEL
    ======================================= -->

    <aside
        id="projectPanel"
        class="project-panel"
    >

    </aside>

    <div
        id="nodeTooltip"
        class="node-tooltip"
    >

    </div>

    <!-- ======================================
         IMPORT MAP
    ======================================= -->

    <script type="importmap">
    {
        "imports": {

            "three":
            "https://unpkg.com/three@0.170.0/build/three.module.js",

            "three/addons/":
            "https://unpkg.com/three@0.170.0/examples/jsm/"

        }
    }
    </script>

    <!-- ======================================
         HERO V2
    ======================================= -->

    <script
        type="module"
        src="./js/hero3d/hero3d.js"
    ></script>

    <!-- ======================================
         PARALLAX SHOWCASE SECTION
    ======================================= -->

    <script type="module">
        import { initParallaxLayers } from "./js/parallaxLayers.js";
        initParallaxLayers(".parallax-section");
    </script>

</body>

</html>
